<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#101923" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101923'/%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%237fe0d4'/%3E%3Crect x='6' y='6' width='4' height='4' fill='%23101923'/%3E%3C/svg%3E" />
<title>DEEPWAKE</title>
<style>
  :root {
    --ink: #f2e9d8;
    --dim: #9fb0bd;
    --amber: #f4b657;
    --teal: #7fe0d4;
    --danger: #ff7a52;
    --panel: rgba(13, 21, 30, 0.93);
    --edge: rgba(159, 196, 214, 0.22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #101923; color: var(--ink);
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

  /* ---- HUD ---- */
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
  }
  .hud-left, .hud-right { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .hud-block { background: rgba(10,17,24,0.62); border: 1px solid var(--edge); border-radius: 6px; padding: 7px 10px; }
  .lbl { display: block; font-size: 10px; letter-spacing: 2.2px; color: var(--dim); margin-bottom: 5px; }
  .segments { display: flex; gap: 4px; }
  .seg { width: 22px; height: 12px; border: 1px solid var(--edge); border-radius: 2px; background: rgba(255,255,255,0.04); }
  .seg.on { background: var(--teal); border-color: var(--teal); box-shadow: 0 0 8px rgba(127,224,212,0.45); }
  .meter { position: relative; width: 132px; height: 12px; border: 1px solid var(--edge); border-radius: 2px; background: rgba(0,0,0,0.35); overflow: hidden; }
  #energyFill { position: absolute; inset: 0; width: 100%; transform-origin: left center;
    background: linear-gradient(90deg, #3f8f96, var(--teal)); transition: transform 0.08s linear; }
  #energyFill.low { background: linear-gradient(90deg, #8a4a32, var(--danger)); }
  #energyText { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--dim); }
  .hud-cost { font-size: 9px; color: var(--dim); margin-top: 4px; letter-spacing: 0.4px; }
  .relays { display: flex; gap: 8px; align-items: center; }
  .relay { width: 26px; height: 26px; border: 1px solid var(--edge); border-radius: 4px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--dim); }
  .relay.powered { color: var(--amber); border-color: rgba(244,182,87,0.5); }
  .relay.active { color: #101923; background: var(--teal); border-color: var(--teal); box-shadow: 0 0 12px rgba(127,224,212,0.5); }
  #archivesCount { font-size: 15px; font-weight: 700; color: var(--teal); }
  .hud-btns { display: flex; gap: 6px; }
  button {
    pointer-events: auto; font: inherit; cursor: pointer; color: var(--ink);
    background: rgba(18,28,38,0.9); border: 1px solid var(--edge); border-radius: 5px;
    padding: 8px 12px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
  }
  button:hover, button:focus-visible { border-color: var(--teal); outline: none; }
  button.primary { background: var(--teal); color: #0d1520; font-weight: 800; border-color: var(--teal); }
  button.ghost { background: transparent; }
  button.small { padding: 6px 9px; font-size: 10px; }

  /* ---- Region, hint, prompt, notices ---- */
  #regionTag { position: absolute; top: 84px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase;
    opacity: 0; transition: opacity 0.4s; }
  #regionTag.show { opacity: 1; }
  #hint { position: absolute; top: 104px; left: 50%; transform: translateX(-50%);
    max-width: min(560px, 88vw); text-align: center; padding: 8px 14px;
    background: rgba(10,17,24,0.72); border: 1px solid var(--edge); border-radius: 5px;
    font-size: 12px; line-height: 1.45; color: var(--ink); opacity: 0; transition: opacity 0.25s; }
  #hint.show { opacity: 1; }
  #prompt { position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
    padding: 8px 16px; background: rgba(10,17,24,0.88); border: 1px solid rgba(244,182,87,0.5);
    border-radius: 20px; font-size: 13px; letter-spacing: 0.6px; color: var(--amber);
    white-space: nowrap; opacity: 0; transition: opacity 0.15s; }
  #prompt.show { opacity: 1; }
  #notice { position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    padding: 7px 14px; background: rgba(10,17,24,0.82); border: 1px solid var(--edge);
    border-radius: 4px; font-size: 12px; letter-spacing: 0.5px; opacity: 0; transition: opacity 0.2s; }
  #notice.show { opacity: 1; }
  #notice.warn { color: var(--danger); border-color: rgba(255,122,82,0.5); }
  #notice.good { color: var(--teal); border-color: rgba(127,224,212,0.5); }

  /* ---- Archive fragment toast ---- */
  #archiveToast { position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%);
    width: min(420px, 88vw); background: var(--panel); border: 1px solid rgba(127,224,212,0.45);
    border-radius: 7px; padding: 14px 16px; display: none; pointer-events: auto; }
  #archiveToast.show { display: block; }
  #archiveToast h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 2px; color: var(--teal); text-transform: uppercase; }
  #archiveToast p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink); }
  #archiveToast .close { margin-top: 10px; }

  /* ---- Touch controls ---- */
  #touch { position: absolute; inset: 0; display: none; }
  #touch.enabled { display: block; }
  .touch-pad { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  .touch-left { left: max(14px, env(safe-area-inset-left)); }
  .touch-right { right: max(14px, env(safe-area-inset-right)); flex-wrap: wrap; justify-content: flex-end; max-width: 46vw; }
  .tbtn { pointer-events: auto; width: 62px; height: 62px; border-radius: 12px;
    background: rgba(14,24,33,0.72); border: 1px solid var(--edge); color: var(--ink);
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; display: grid; place-items: center;
    touch-action: none; }
  .tbtn.pressed { background: rgba(127,224,212,0.35); border-color: var(--teal); }
  .tbtn.wide { width: 70px; }
  .tbtn.pulse { border-color: rgba(127,224,212,0.5); }

  /* ---- Overlays ---- */
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(6,11,17,0.72); backdrop-filter: blur(3px); pointer-events: auto; padding: 16px; }
  #overlay.show { display: flex; }
  .card { width: min(480px, 94vw); max-height: min(88vh, 760px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
    padding: 26px 26px 22px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .card h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); letter-spacing: 7px; text-transform: uppercase; }
  .card h1 .accent { color: var(--teal); }
  .card .sub { margin: 10px 0 20px; font-size: 13px; line-height: 1.65; color: var(--dim); }
  .card .section-title { font-size: 10px; letter-spacing: 2.5px; color: var(--dim); text-transform: uppercase; margin: 18px 0 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .actions button { flex: 1 1 auto; min-width: 120px; padding: 12px 14px; }
  .rows { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 13px; }
  .rows .k { color: var(--dim); }
  .rows .v { text-align: right; color: var(--ink); font-weight: 700; }
  .rows .v.accent { color: var(--teal); }
  .tag { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 10px; letter-spacing: 1.4px;
    text-transform: uppercase; border: 1px solid var(--edge); color: var(--dim); }
  .tag.full { color: var(--teal); border-color: var(--teal); }
  .option { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); margin-top: 10px; }
  .option button { padding: 6px 10px; font-size: 10px; }
  .archive-list { display: grid; gap: 8px; }
  .archive-item { border: 1px solid var(--edge); border-radius: 5px; padding: 9px 11px; font-size: 12px; line-height: 1.5; }
  .archive-item.locked { opacity: 0.42; }
  .archive-item b { color: var(--teal); letter-spacing: 1px; }
  .hint-line { font-size: 11px; color: var(--dim); margin-top: 14px; line-height: 1.6; }
  kbd { font-family: inherit; border: 1px solid var(--edge); border-radius: 3px; padding: 1px 5px; font-size: 10px; color: var(--ink); }

  /* ---- Responsive ---- */
  @media (max-width: 820px) {
    #hud { gap: 6px; padding: 10px; }
    .hud-left, .hud-right { gap: 6px; }
    .hud-block { padding: 5px 7px; }
    .meter { width: 96px; }
    .lbl { font-size: 9px; letter-spacing: 1.4px; }
    #regionTag { display: none; }
    #hint { top: 174px; font-size: 11px; max-width: 92vw; }
    #notice { top: 232px; }
    #prompt { bottom: 27%; }
  }
  @media (max-height: 480px) {
    #hud { padding: 6px 10px; }
    #regionTag, #hint { top: 62px; }
    #hint { font-size: 10px; padding: 5px 10px; }
    #notice { top: 96px; }
    #prompt { bottom: 24%; }
    .card { padding: 16px; }
    .card h1 { font-size: 24px; }
    .card .sub { margin: 6px 0 12px; }
    .tbtn { width: 52px; height: 52px; }
  }
  @media (max-width: 460px) {
    .hud-right { flex-direction: column; align-items: flex-end; }
    .relay { width: 22px; height: 22px; }
    #hint { max-width: 92vw; }
    .tbtn { width: 54px; height: 54px; font-size: 10px; }
  }
  /* Narrow AND short viewports: keep the stacked banner clear of the wrapped HUD. */
  @media (max-width: 460px) and (max-height: 520px) {
    #hint { top: 174px; font-size: 10px; }
    #notice { top: 226px; }
    #prompt { bottom: 27%; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="ui">

    <div id="hud">
      <div class="hud-left">
        <div class="hud-block">
          <span class="lbl">INTEGRITY</span>
          <div id="integrity" class="segments"><i class="seg"></i><i class="seg"></i><i class="seg"></i></div>
        </div>
        <div class="hud-block">
          <span class="lbl">RESONANCE</span>
          <div style="display:flex;align-items:center">
            <div class="meter"><div id="energyFill"></div></div>
            <span id="energyText" class="mono">100</span>
          </div>
          <div class="hud-cost">PULSE 35 · SHIELD 50</div>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-block">
          <span class="lbl">RELAYS</span>
          <div id="relays" class="relays">
            <div class="relay" data-relay="A">A</div>
            <div class="relay" data-relay="B">B</div>
            <div class="relay" data-relay="C">C</div>
          </div>
        </div>
        <div class="hud-block">
          <span class="lbl">ARCHIVES</span>
          <div><span id="archivesCount" class="mono">0 / 3</span></div>
        </div>
        <div class="hud-btns">
          <button id="muteBtn" class="small" aria-label="Mute audio">SOUND ON</button>
          <button id="pauseBtn" class="small" aria-label="Pause">PAUSE</button>
        </div>
      </div>
    </div>

    <div id="regionTag"></div>
    <div id="hint"></div>
    <div id="notice"></div>
    <div id="prompt"></div>

    <div id="archiveToast">
      <h3 id="archiveTitle">Memory Archive</h3>
      <p id="archiveText"></p>
      <button id="archiveClose" class="small ghost close">DISMISS</button>
    </div>

    <div id="touch">
      <div class="touch-pad touch-left">
        <button class="tbtn" data-act="left" aria-label="Move left">◀</button>
        <button class="tbtn" data-act="right" aria-label="Move right">▶</button>
      </div>
      <div class="touch-pad touch-right">
        <button class="tbtn pulse" data-act="pulse" aria-label="Echo pulse">PULSE</button>
        <button class="tbtn" data-act="dash" aria-label="Dash">DASH</button>
        <button class="tbtn" data-act="interact" aria-label="Interact">USE</button>
        <button class="tbtn" data-act="jump" aria-label="Jump">JUMP</button>
      </div>
    </div>

    <div id="overlay">
      <div class="card">
        <h1 id="ovTitle">DEEPWAKE</h1>
        <p id="ovSub" class="sub"></p>
        <div id="ovBody"></div>
        <div id="ovActions" class="actions"></div>
      </div>
    </div>

  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
